<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Websocket Chat</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0b0d12;
        color: #e8eaed;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .chat {
        width: 100%;
        max-width: 720px;
        height: 90vh;
        background: #14171f;
        border: 1px solid #1f2530;
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }

      .chat__header {
        padding: 18px 22px;
        border-bottom: 1px solid #1f2530;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #161a23;
      }

      .chat__title {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }

      .chat__status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #8a93a6;
      }

      .chat__status::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 8px #22c55e;
      }

      .chat__messages {
        flex: 1;
        overflow-y: auto;
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .chat__messages::-webkit-scrollbar {
        width: 8px;
      }

      .chat__messages::-webkit-scrollbar-thumb {
        background: #232a37;
        border-radius: 4px;
      }

      .msg {
        max-width: 70%;
        padding: 10px 14px;
        border-radius: 14px;
        font-size: 14px;
        line-height: 1.45;
        word-wrap: break-word;
      }

      .msg__meta {
        font-size: 11px;
        color: #6b7280;
        margin-top: 4px;
      }

      .msg--in {
        align-self: flex-start;
        background: #1e2330;
        border-bottom-left-radius: 4px;
      }

      .msg--out {
        align-self: flex-end;
        background: #2b5cff;
        color: #fff;
        border-bottom-right-radius: 4px;
      }

      .msg--out .msg__meta {
        color: rgba(255, 255, 255, 0.7);
        text-align: right;
      }

      .chat__composer {
        padding: 14px 16px;
        border-top: 1px solid #1f2530;
        background: #161a23;
        display: flex;
        gap: 10px;
      }

      .chat__input {
        flex: 1;
        background: #0f1219;
        border: 1px solid #232a37;
        border-radius: 10px;
        padding: 12px 14px;
        color: #e8eaed;
        font-size: 14px;
        outline: none;
        transition: border-color 0.15s;
      }

      .chat__input:focus {
        border-color: #2b5cff;
      }

      .chat__send {
        background: #2b5cff;
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 0 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }

      .chat__send:hover {
        background: #1f4ae0;
      }

      .chat__send:disabled {
        background: #232a37;
        color: #6b7280;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <main class="chat">
      <header class="chat__header">
        <div class="chat__title">Websocket Chat</div>
        <div class="chat__status">live</div>
      </header>

      <section class="chat__messages" id="messages">
        <div class="msg msg--in">
          Hey! Welcome to the chat.
          <div class="msg__meta">Alice · 10:42</div>
        </div>
        <div class="msg msg--out">
          Thanks! Glad to be here.
          <div class="msg__meta">You · 10:43</div>
        </div>
        <div class="msg msg--in">
          What are you working on today?
          <div class="msg__meta">Alice · 10:43</div>
        </div>
      </section>

      <form class="chat__composer" id="composer">
        <input
          type="text"
          class="chat__input"
          id="input"
          placeholder="Type a message..."
          autocomplete="off"
        />
        <button type="submit" id="send" class="chat__send">Send</button>
      </form>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      // You can give host here if client and server running in different ports
      const socket = io();

      socket.on("server:message", (data) => {
        console.log("Message from server", data);
        appendMessage(data.message, "msg msg--in");
      });
      const messages = document.getElementById("messages");
      function formatTime() {
        return new Date().toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function appendMessage(text, type = "msg--out") {
        const msg = document.createElement("div");
        msg.classList = `msg ${type}`;
        msg.textContent = text;

        const time = document.createElement("div");
        time.classList = "msg__meta";
        time.textContent = formatTime();
        msg.appendChild(time);

        messages.append(msg);
        messages.scrollTop = messages.scrollHeight;
      }
      const composer = document.getElementById("composer");
      const input = document.getElementById("input");

      function onMessageInput(message) {
        console.log({ message });
        socket.emit("user:message", { message });
      }

      composer.addEventListener("submit", (event) => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message) return;
        appendMessage(message);
        onMessageInput(message);

        input.value = "";
      });

      window.onMessageInput = onMessageInput;
    </script>
  </body>
</html>
